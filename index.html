<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063d31"><link rel="manifest" href="manifest.webmanifest"><title>Master Fértil</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#062a23;color:#fff}button{font:inherit}.hide{display:none!important}
#menu{position:fixed;inset:0;background:linear-gradient(#0003,#001b),url("assets/portal.png") center/cover;display:grid;place-items:center;padding:15px}.box{background:#063d31e8;border:2px solid #51e5bd;border-radius:24px;padding:20px;width:min(850px,96vw);text-align:center}.pick{display:flex;justify-content:center;gap:15px}.c{background:#0a5547;color:white;border:3px solid transparent;border-radius:18px;padding:10px;width:44%}.c.sel{border-color:#ffd84d}.c img{width:100%;height:230px;object-fit:contain}.go{border:0;border-radius:99px;background:#ffd84d;color:#153b31;padding:14px 25px;font-weight:bold;margin-top:15px}

.controls{position:absolute;z-index:20;right:10px;top:10px}.controls button{background:#063d31e8;color:#fff;border:1px solid #fff8;border-radius:12px;padding:10px;font-size:20px}

.actions{position:absolute;z-index:20;right:20px;bottom:25px;display:flex;gap:12px}.act{width:76px;height:76px;border-radius:50%;border:2px solid white;background:#063d31dd;color:white;font-size:27px}.act small{display:block;font-size:10px}

/* Tablet, landscape and touch-friendly layout */
html,body{width:100%;height:100%;height:100dvh;overscroll-behavior:none}#game,#world,#menu,#modal{height:100%;height:100dvh}button{touch-action:manipulation;cursor:pointer}#world{overflow:hidden}#menu,#modal{overflow-y:auto;align-items:center}.box,.panel{max-height:calc(100dvh - 24px);overflow-y:auto}.c img{height:clamp(70px,24dvh,230px)}.pick{gap:clamp(5px,2vw,15px)}.hud{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));font-size:clamp(12px,2vw,17px)}.controls{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}#joy{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:clamp(95px,21vmin,145px);height:clamp(95px,21vmin,145px)}#knob{width:42%;height:42%}.actions{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));gap:10px}.act{width:clamp(58px,12vmin,76px);height:clamp(58px,12vmin,76px)}#hero{width:clamp(52px,12vmin,90px);height:clamp(75px,17vmin,125px)}.poi{width:clamp(34px,8vmin,52px);height:clamp(34px,8vmin,52px);font-size:clamp(18px,4vmin,25px)}.panel{width:min(580px,96vw)}.ans{min-height:44px}
@media (orientation:landscape) and (max-height:600px){.box{padding:8px 16px}.box h1{font-size:clamp(19px,5vh,30px);margin:3px}.box p{margin:4px}.c{padding:4px}.c img{height:clamp(52px,26vh,125px)}.go{margin-top:6px;padding:9px 18px}.panel{padding:10px 16px}.panel h2{margin:3px 0}.panel p{margin:7px 0}.answers{gap:5px}.ans{padding:7px 10px}#toast{top:52px}}
@media (max-width:420px) and (orientation:portrait){.hud{padding:7px}.controls button{padding:7px}.box{padding:12px}.c img{height:clamp(100px,22vh,170px)}}
</style></head><body>
<section id="menu"><div class="box"><h1>🌿 Master Fértil</h1><p>O Caminho da Alimentação</p><div class="pick"><button class="c sel" data-name="Theo"><img src="assets/theo.png"><b>THEO</b></button><button class="c" data-name="Maya"><img src="assets/maya.png"><b>MAYA</b></button></div><button id="start" class="go">ENTRAR NO MUNDO ▶</button></div></section>
<section id="game" class="hide"><div id="world"><div class="shade"></div><img id="hero" src="assets/theo.png"><div class="hud"><span id="nm">Theo</span><br><span class="money">🪙 <span id="coins">0</span></span> &nbsp; ⭐ <span id="stars">0</span></div><div class="controls"><button id="snd">🔊</button> <button id="home">⌂</button></div>
<div class="poi" data-k="quiz" style="left:24%;top:35%">❓</div><div class="poi" data-k="npc" style="left:72%;top:31%">💬</div><div class="poi" data-k="food" style="left:78%;top:67%">🥕</div><div class="poi" data-k="gem" style="left:39%;top:67%">💎</div><div class="poi" data-k="quiz" style="left:56%;top:48%">💡</div>
<div id="hint" class="hide">INTERAGIR</div><div id="toast"></div><div id="joy"><div id="knob"></div></div><div class="actions"><button id="inter" class="act">💬<small>Interagir</small></button><button id="run" class="act">🏃<small>Correr</small></button></div></div></section>
<div id="modal" class="hide"><div class="panel"><h2 id="title"></h2><p id="question"></p><div id="answers" class="answers"></div><button id="close" class="go">Continuar</button></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let who="Theo",x=.5,y=.8,vx=0,vy=0,coins=0,stars=0,near=null,running=false,sound=true,last=performance.now();
function beep(f=600,d=.08){if(!sound)return;let A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;o.connect(g);g.connect(A.destination);g.gain.value=.06;o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.stop(A.currentTime+d)}
$$(".c").forEach(b=>b.onclick=()=>{$$(".c").forEach(z=>z.classList.remove("sel"));b.classList.add("sel");who=b.dataset.name;beep()});
$("#start").onclick=()=>{let src=who==="Theo"?"assets/theo.png":"assets/maya.png";$("#hero").src=src;$("#nm").textContent=who;$("#menu").classList.add("hide");$("#game").classList.remove("hide");beep(800,.12)};
$("#home").onclick=()=>{$("#game").classList.add("hide");$("#menu").classList.remove("hide")};$("#snd").onclick=()=>{sound=!sound;$("#snd").textContent=sound?"🔊":"🔇";if(sound)beep()};
let activeJoyPointer=null;function joy(e){let r=$("#joy").getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.hypot(dx,dy),L=r.width*.31;if(m>L){dx*=L/m;dy*=L/m}vx=dx/L;vy=dy/L;$("#knob").style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
$("#joy").onpointerdown=e=>{$("#joy").setPointerCapture(e.pointerId);activeJoyPointer=e.pointerId;joy(e)};$("#joy").onpointermove=e=>{if(e.pointerId === activeJoyPointer)joy(e)};function stop(){activeJoyPointer=null;vx=vy=0;$("#knob").style.transform="translate(-50%,-50%)"}$("#joy").onpointerup=stop;$("#joy").onpointercancel=stop;
$("#run").onpointerdown=()=>running=true;$("#run").onpointerup=$("#run").onpointercancel=()=>running=false;
addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(k==="w"||e.key==="ArrowUp")vy=-1;if(k==="s"||e.key==="ArrowDown")vy=1;if(k==="a"||e.key==="ArrowLeft")vx=-1;if(k==="d"||e.key==="ArrowRight")vx=1;if(k==="e")interact();if(e.key==="Shift")running=true});addEventListener("keyup",e=>{if(["w","a","s","d"].includes(e.key.toLowerCase())||e.key.startsWith("Arrow"))vx=vy=0;if(e.key==="Shift")running=false});
function loop(t){let dt=Math.min((t-last)/1000,.04);last=t;let s=running?.24:.14;x=Math.max(.05,Math.min(.95,x+vx*s*dt));y=Math.max(.18,Math.min(.94,y+vy*s*dt));$("#hero").style.left=x*100+"%";$("#hero").style.top=y*100+"%";if(vx<-.1)$("#hero").style.transform="translate(-50%,-75%) scaleX(-1)";if(vx>.1)$("#hero").style.transform="translate(-50%,-75%) scaleX(1)";detect();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function detect(){if(!$("#modal").classList.contains("hide")){near=null;return}near=null;let bd=.11;$$(".poi:not(.done)").forEach(p=>{let px=parseFloat(p.style.left)/100,py=parseFloat(p.style.top)/100,d=Math.hypot(px-x,py-y);if(d<bd){bd=d;near=p}});if(near){$("#hint").classList.remove("hide");$("#hint").style.left=near.style.left;$("#hint").style.top=near.style.top}else $("#hint").classList.add("hide")}
const Q=[["Qual opção é boa fonte de fibras?",["Frutas, verduras e grãos integrais","Somente açúcar","Somente refrigerante"],0],["Por que variar os alimentos?",["Para obter diferentes nutrientes","Porque água deixa de ser necessária","Porque um alimento contém tudo"],0]];
function interact(){if(!near){toast("Aproxime-se de um ponto brilhante");beep(220);return}let k=near.dataset.k,q;if(k==="quiz")q=Q[Math.floor(Math.random()*Q.length)];if(k==="npc")q=["A agricultora ensina: valorize alimentos in natura ou minimamente processados.",["Entendi!"],0];if(k==="food")q=["Você encontrou vegetais. Qual escolha favorece variedade?",["Variar cores e tipos","Escolher sempre o mesmo"],0];if(k==="gem")q=["Cristal do conhecimento: a água participa de muitas funções do organismo.",["Coletar cristal"],0];$("#title").textContent=k==="quiz"?"Desafio":k==="npc"?"Conversa":k==="gem"?"Cristal":"Descoberta";$("#question").textContent=q[0];$("#answers").innerHTML="";q[1].forEach((a,i)=>{let b=document.createElement("button");b.className="ans";b.textContent=a;b.onclick=()=>answer(b,i===q[2]);$("#answers").appendChild(b)});$("#modal").classList.remove("hide");beep(720)}
function answer(b,ok){if(!near)return;$$(".ans").forEach(z=>z.disabled=true);b.classList.add(ok?"ok":"bad");if(ok){let n=near.dataset.k==="gem"?10:5;coins+=n;stars++;$("#coins").textContent=coins;$("#stars").textContent=stars;near.classList.add("done");toast("+"+n+" moedas!");beep(950,.15)}else{toast("Resposta incorreta");beep(180,.18)}}
function toast(t){$("#toast").textContent=t;$("#toast").classList.add("on");setTimeout(()=>$("#toast").classList.remove("on"),1500)}$("#inter").onclick=interact;$("#close").onclick=()=>{$("#modal").classList.add("hide");near=null};document.addEventListener("visibilitychange",()=>{if(document.hidden){stop();running=false}});
window.addEventListener("blur",()=>{stop();running=false});
window.addEventListener("resize",()=>{stop();running=false});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
